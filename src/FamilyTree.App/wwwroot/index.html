<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FamilyTree</title>
    <!-- Rewritten to the repository subpath by the GitHub Pages deploy workflow. -->
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Fonts are self-hosted and declared in tokens.css; this app makes no
         third-party requests. Preloaded because they are render-blocking for
         the shell and the stylesheet only discovers them after it parses. -->
    <link rel="preload" href="_content/FamilyTree.UI/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="_content/FamilyTree.UI/fonts/source-serif-4-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="_content/FamilyTree.UI/css/tokens.css" />
    <link rel="stylesheet" href="_content/FamilyTree.UI/css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FamilyTree.App.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
